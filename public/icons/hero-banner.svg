<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0e121e" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Instagram Gradient -->
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="50%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#fcb045" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="120" r="140" fill="#833ab4" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="380" r="160" fill="#fd1d1d" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="240" r="200" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Grid overlay lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Side: Brand & Badges -->
  <g transform="translate(80, 110)">
    <!-- App Icon Box -->
    <rect width="64" height="64" rx="18" fill="url(#igGrad)" filter="url(#cardShadow)" />
    <g transform="translate(16, 16)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect width="24" height="24" rx="5" />
      <circle cx="12" cy="12" r="5" />
      <circle cx="19" cy="5" r="1" fill="#ffffff" />
    </g>

    <!-- Version Badge -->
    <rect x="80" y="16" width="160" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="160" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">v2.0 • OPEN SOURCE</text>

    <!-- Title -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.03em">
      InstaCollage <tspan fill="url(#igGrad)">Studio</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
      Instagram Carousel Unpacker & High-DPI Canvas Collage Suite
    </text>

    <!-- Credits Pill -->
    <g transform="translate(0, 205)">
      <rect width="440" height="42" rx="12" fill="rgba(20, 27, 45, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="20" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        Developed by <tspan fill="#ffffff" font-weight="700">Mahmoud Madi</tspan> • Powered by <tspan fill="#38bdf8" font-weight="700">Premier Tech & Voxo AI</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Interactive Collage Demo Showcase -->
  <g transform="translate(680, 50)" filter="url(#cardShadow)">
    <!-- Canvas Frame -->
    <rect width="450" height="380" rx="20" fill="#141b2d" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- 2x2 Collage Mockup Grid -->
    <g transform="translate(18, 18)">
      <!-- Tile 1 (Architecture Sunset) -->
      <rect width="198" height="164" rx="10" fill="#833ab4" opacity="0.8" />
      <text x="99" y="88" fill="#ffffff" font-family="sans-serif" font-size="28" text-anchor="middle" opacity="0.6">🏛️</text>
      
      <!-- Tile 2 (Fashion Neon) -->
      <rect x="216" width="198" height="164" rx="10" fill="#fd1d1d" opacity="0.8" />
      <text x="315" y="88" fill="#ffffff" font-family="sans-serif" font-size="28" text-anchor="middle" opacity="0.6">👗</text>

      <!-- Tile 3 (Cyberpunk Hardware) -->
      <rect y="180" width="198" height="164" rx="10" fill="#fcb045" opacity="0.8" />
      <text x="99" y="268" fill="#ffffff" font-family="sans-serif" font-size="28" text-anchor="middle" opacity="0.6">⚡</text>

      <!-- Tile 4 (Alpine Expedition) -->
      <rect x="216" y="180" width="198" height="164" rx="10" fill="#00f2fe" opacity="0.8" />
      <text x="315" y="268" fill="#ffffff" font-family="sans-serif" font-size="28" text-anchor="middle" opacity="0.6">🏔️</text>
    </g>

    <!-- Floating Polaroid Badge -->
    <g transform="translate(-30, 260) rotate(-8)" filter="url(#cardShadow)">
      <rect width="130" height="150" rx="8" fill="#ffffff" />
      <rect x="10" y="10" width="110" height="100" rx="4" fill="#1e293b" />
      <text x="65" y="65" fill="#ffffff" font-family="sans-serif" font-size="20" text-anchor="middle">✨</text>
      <text x="65" y="132" fill="#090b10" font-family="'Caveat', cursive, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Polaroid Mode</text>
    </g>
  </g>
</svg>
