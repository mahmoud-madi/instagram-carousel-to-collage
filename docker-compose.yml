version: '3.8'

services:
  instacollage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instacollage-studio
    restart: unless-stopped
    ports:
      - "3300:3300"
    environment:
      - PORT=3300
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3300/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
